name: Bug report
description: Something in Silk Quest is not working as expected.
title: "[Bug] "
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Click…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Silk Quest version
      placeholder: "0.3.0"
  - type: input
    id: system
    attributes:
      label: System
      placeholder: "Windows 11 x64, or Android version and device model"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or error text
      description: Optional. Remove personal task text, pairing codes and other private details before sharing.
